[workspace]
resolver = "3"
members = ["crates/visualization", "crates/analyzer-files", "crates/stream-metadata-cache", "crates/glowfish-data", "crates/cli", "crates/glowfish-app"]

# Bevy is unusably slow in plain debug builds: optimize dependencies, keep own code fast to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
