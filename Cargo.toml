[package]
name = "stream-metadata-cache"
version = "0.1.0"
edition = "2024"

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
full = ["sqlite", "postgres"]

[dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "sqlite", "macros", "chrono"] }
tokio = { version = "1", features = ["full"] }
analyzer-files = { path = "../analyzer-files/" }
chrono = "0.4.45"
walkdir = "2.5.0"
async-trait = "0.1.89"
thiserror = "2.0.18"
