[project]
site_name = "glowfish"
site_description = "Fast 3D visualization of Analyzer4D measurement files"
site_url = "https://ossmos.github.io/glowfish/"
repo_url = "https://github.com/ossmos/glowfish"
repo_name = "ossmos/glowfish"
nav = [
  { "Get started" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = [
    { "The viewer" = "usage/viewer.md" },
    { "Opening a folder" = "usage/folders.md" },
    { "Exporting images" = "usage/export.md" },
    { "Opening from the file manager" = "usage/file-manager.md" },
    { "Command line reference" = "usage/command-line.md" },
  ] },
  { "Configuration" = "configuration.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
