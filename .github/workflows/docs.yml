name: Documentation

# Builds the zensical documentation in docs/ and publishes it to GitHub Pages.
# Pull requests only build it, to catch broken pages before they are merged.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a running deployment is finished, not cancelled
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # pinned so that a new zensical release cannot change or break the site unnoticed
  ZENSICAL_VERSION: 0.0.74

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the site
        run: uvx "zensical@${ZENSICAL_VERSION}" build --clean --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
